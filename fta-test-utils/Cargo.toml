[package]
name = "fta-test-utils"
version = "0.1.0"
edition = "2021"

[dependencies]
# Testing framework
tokio = { version = "1.42", features = ["full"] }
axum = "0.7"
tower = "0.5"
http-body-util = "0.1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# JSON serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# UUID
uuid = { version = "1.11", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Shared crates
fta-errors = { path = "../fta-errors" }
fta-types = { path = "../fta-types" }

# Environment
dotenvy = "0.15"

# Random data generation
fake = { version = "2.10", features = ["derive", "chrono", "uuid"] }
rand = "0.8"

[dev-dependencies]
# None needed - this is a test utility crate
