services:
  postgres:
    image: postgres:16-alpine
    container_name: fta-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fta-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fta-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    networks:
      - fta-network
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:${PORT:-3000}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true

  migration:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fta-migration
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - fta-network
    command: ["fta-migration"]
    profiles:
      - migrate

networks:
  fta-network:
    driver: bridge
    name: fta-network

volumes:
  postgres_data:
    driver: local
    name: fta-postgres-data
